<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面接対策アプリ</title>
<!-- SheetJS (Excel読み込み用) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Tailwind CSS (スタイリング用) -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f3f4f6; color: #333; }
    .hidden { display: none !important; }
    /* スマホでのタップハイライトを無効化 */
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .checkbox-custom { width: 1.25rem; height: 1.25rem; }
    
    /* ボトムナビゲーションのスタイル */
    .nav-item { flex: 1; text-align: center; padding: 0.75rem 0; color: #6b7280; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem;}
    .nav-item.active { color: #2563eb; font-weight: bold; }
    .nav-icon { width: 1.5rem; height: 1.5rem; }
</style>
</head>
<body class="h-screen flex flex-col bg-gray-100 overflow-hidden">

<!-- メインコンテンツ領域（スクロール可能） -->
<main class="flex-grow overflow-y-auto p-4 pb-20">
    <div class="w-full max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">面接対策アプリ</h1>

        <!-- ====================
             1. 練習ページ (デフォルト)
             ==================== -->
        <div id="page-practice" class="page-content block">
            
            <!-- 練習前設定画面 -->
            <div id="practice-setup" class="space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h2 class="text-lg font-bold mb-3 border-b pb-2">練習設定</h2>
                    
                    <div class="mb-4">
                        <p class="font-bold text-sm mb-2 text-gray-700">出題モード</p>
                        <div class="flex space-x-6">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="orderMode" value="sequential" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                                <span>順番通り</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="orderMode" value="random" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                                <span>ランダム</span>
                            </label>
                        </div>
                    </div>

                    <div class="mb-2">
                        <div class="flex justify-between items-end mb-2">
                            <p class="font-bold text-sm text-gray-700">出題する質問を選ぶ</p>
                            <div class="space-x-2 text-xs">
                                <button id="btn-check-all" class="text-blue-600 bg-blue-50 px-2 py-1 rounded">全て選択</button>
                                <button id="btn-uncheck-all" class="text-gray-600 bg-gray-100 px-2 py-1 rounded">全て外す</button>
                            </div>
                        </div>
                        <p id="no-data-msg" class="text-sm text-red-500 hidden">データがありません。設定ページから読み込んでください。</p>
                        <div id="select-list-container" class="max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-1 bg-gray-50">
                            <!-- JSでリスト生成 -->
                        </div>
                    </div>
                </div>

                <button id="btn-start" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 active:bg-blue-800 transition transform active:scale-95">
                    面接練習スタート
                </button>
            </div>

            <!-- 練習中画面 -->
            <div id="practice-active" class="hidden flex-col h-full space-y-4">
                <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm">
                    <span id="progress-text" class="text-sm font-bold text-gray-600">1 / 5</span>
                    <button id="btn-quit" class="text-sm text-red-500 font-bold px-3 py-1 bg-red-50 rounded-md">やめる</button>
                </div>

                <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm min-h-[120px]">
                    <p class="text-xs text-blue-500 font-bold mb-2">質問</p>
                    <p id="practice-question" class="text-lg font-bold text-gray-800 whitespace-pre-wrap leading-relaxed">...</p>
                </div>

                <div id="answer-area" class="hidden">
                    <div class="bg-green-50 border border-green-200 rounded-xl p-5 shadow-sm min-h-[120px]">
                        <p class="text-xs text-green-600 font-bold mb-2">用意した回答</p>
                        <p id="practice-answer" class="text-base text-gray-800 whitespace-pre-wrap leading-relaxed">...</p>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="btn-show-answer" class="w-full bg-gray-800 text-white font-bold py-4 px-4 rounded-xl shadow-md active:bg-gray-900 transition transform active:scale-95">
                        回答を見る
                    </button>
                    <button id="btn-next" class="hidden w-full bg-blue-600 text-white font-bold py-4 px-4 rounded-xl shadow-md active:bg-blue-800 transition transform active:scale-95">
                        次の質問へ
                    </button>
                    <button id="btn-finish" class="hidden w-full bg-green-500 text-white font-bold py-4 px-4 rounded-xl shadow-md active:bg-green-600 transition transform active:scale-95">
                        お疲れ様でした（設定へ戻る）
                    </button>
                </div>
            </div>

        </div>

        <!-- ====================
             2. 一覧ページ
             ==================== -->
        <div id="page-list" class="page-content hidden">
            <div class="bg-white rounded-xl shadow-sm p-4 h-full">
                <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">質問・回答 一覧</h2>
                <div id="full-list-container" class="space-y-4 pb-4">
                    <!-- JSで一覧生成 -->
                </div>
                <div id="list-empty-msg" class="text-center text-gray-500 py-10 hidden">
                    <p>データがありません。</p>
                    <p class="text-sm mt-2">設定ページからExcelファイルを<br>読み込んでください。</p>
                </div>
            </div>
        </div>

        <!-- ====================
             3. 読み込み (設定) ページ
             ==================== -->
        <div id="page-settings" class="page-content hidden">
            <div class="bg-white rounded-xl shadow-sm p-4 space-y-6">
                
                <div>
                    <h2 class="text-xl font-bold mb-2 text-gray-800">データ読み込み</h2>
                    <p class="text-sm text-gray-600 mb-4">A列に「質問」、B列に「回答」が入力されたExcelファイル(.xlsx)を選択してください。※読み込むと現在のデータは上書きされます。</p>
                    
                    <label for="fileInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-300 rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-10 h-10 mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mb-2 text-sm text-blue-600 font-bold">タップしてExcelファイルを選択</p>
                            <p class="text-xs text-gray-500">(.xlsx / .xls)</p>
                        </div>
                        <input id="fileInput" type="file" accept=".xlsx, .xls" class="hidden" />
                    </label>
                </div>

                <div class="border-t pt-4">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">データ管理</h3>
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                        <span class="text-sm text-gray-600">現在の登録数</span>
                        <span id="data-count" class="font-bold text-lg text-blue-600">0件</span>
                    </div>
                    <button id="btn-clear-data" class="mt-3 w-full border border-red-300 text-red-500 font-bold py-2 px-4 rounded-lg hover:bg-red-50 active:bg-red-100 transition text-sm">
                        データを全て削除する
                    </button>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- ====================
     ボトムナビゲーション
     ==================== -->
<nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 flex justify-around shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-50 pb-safe">
    <a href="#" class="nav-item active" data-target="page-practice">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="text-xs">練習</span>
    </a>
    <a href="#" class="nav-item" data-target="page-list">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-xs">一覧</span>
    </a>
    <a href="#" class="nav-item" data-target="page-settings">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="text-xs">設定/読込</span>
    </a>
</nav>

<style>
    /* iPhoneのセーフエリア対応 */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    }
</style>

<script>
    // --- LocalStorage による状態管理 ---
    const STORAGE_KEY = 'interviewAppQAData';
    let allQA = []; // {id, q, a, checked}
    let targetQA = [];
    let currentIndex = 0;

    // 初期化処理
    function init() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            try {
                allQA = JSON.parse(savedData);
            } catch(e) {
                console.error("データのパースに失敗しました", e);
                allQA = [];
            }
        }
        updateAllViews();
    }

    // データの保存
    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allQA));
        updateAllViews();
    }

    // --- 各画面の更新処理 ---
    function updateAllViews() {
        renderPracticeSelectionList();
        renderFullList();
        updateSettingsCount();
        
        // データ有無による表示切り替え
        const noDataMsg = document.getElementById('no-data-msg');
        const selectListContainer = document.getElementById('select-list-container');
        const btnStart = document.getElementById('btn-start');
        
        if (allQA.length === 0) {
            noDataMsg.classList.remove('hidden');
            selectListContainer.classList.add('hidden');
            btnStart.disabled = true;
            btnStart.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            noDataMsg.classList.add('hidden');
            selectListContainer.classList.remove('hidden');
            btnStart.disabled = false;
            btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    }

    // 1. 練習用選択リストの描画
    function renderPracticeSelectionList() {
        const container = document.getElementById('select-list-container');
        container.innerHTML = '';
        allQA.forEach((qa, index) => {
            const div = document.createElement('div');
            div.className = "flex items-center space-x-3 p-2 bg-white rounded border border-gray-100";
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = "checkbox-custom cursor-pointer accent-blue-600 flex-shrink-0";
            checkbox.checked = qa.checked !== false; // 未定義の場合はtrue
            checkbox.dataset.id = qa.id;
            checkbox.addEventListener('change', (e) => {
                qa.checked = e.target.checked;
                saveData(); // 状態を保存
            });

            const textDiv = document.createElement('div');
            textDiv.className = "flex-1 cursor-pointer";
            textDiv.innerHTML = `<p class="text-sm text-gray-800 line-clamp-1">${index + 1}. ${qa.q}</p>`;
            textDiv.addEventListener('click', () => {
                checkbox.checked = !checkbox.checked;
                qa.checked = checkbox.checked;
                saveData();
            });

            div.appendChild(checkbox);
            div.appendChild(textDiv);
            container.appendChild(div);
        });
    }

    // 2. 全一覧リストの描画
    function renderFullList() {
        const container = document.getElementById('full-list-container');
        const emptyMsg = document.getElementById('list-empty-msg');
        
        container.innerHTML = '';
        
        if (allQA.length === 0) {
            emptyMsg.classList.remove('hidden');
            return;
        }
        
        emptyMsg.classList.add('hidden');
        allQA.forEach((qa, index) => {
            const div = document.createElement('div');
            div.className = "bg-gray-50 p-4 rounded-lg border border-gray-200";
            div.innerHTML = `
                <div class="flex items-start mb-2">
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded mr-2 mt-0.5">Q${index + 1}</span>
                    <p class="text-sm font-bold text-gray-800 whitespace-pre-wrap">${qa.q}</p>
                </div>
                <div class="flex items-start mt-3 pt-3 border-t border-gray-200">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded mr-2 mt-0.5">A</span>
                    <p class="text-sm text-gray-700 whitespace-pre-wrap">${qa.a}</p>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // 3. 設定画面のカウント更新
    function updateSettingsCount() {
        document.getElementById('data-count').textContent = `${allQA.length}件`;
    }

    // --- Excelファイル読み込み処理 ---
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                
                let newQA = [];
                let idCounter = Date.now(); // 一意なID
                
                json.forEach((row, index) => {
                    if (row.length >= 2 && row[0] && row[1]) {
                        if (index === 0 && (String(row[0]).includes('質問') || row[0] === 'Q')) return;
                        newQA.push({
                            id: idCounter++,
                            q: String(row[0]).trim(),
                            a: String(row[1]).trim(),
                            checked: true
                        });
                    }
                });

                if (newQA.length === 0) {
                    alert("質問と回答が見つかりませんでした。A列に質問、B列に回答を入力してください。");
                } else {
                    allQA = newQA; // 上書き
                    saveData();
                    alert(`${allQA.length}件のデータを読み込みました！`);
                    // 読み込み完了したら練習ページへ移動
                    switchTab('page-practice');
                }
            } catch(error) {
                alert("ファイルの読み込みに失敗しました。正しいExcelファイルか確認してください。");
                console.error(error);
            }
            // 同じファイルを再度選べるようにリセット
            document.getElementById('fileInput').value = '';
        };
        reader.readAsArrayBuffer(file);
    });

    // --- イベントリスナー ---
    
    // 全て選択 / 外す
    document.getElementById('btn-check-all').addEventListener('click', () => {
        allQA.forEach(qa => qa.checked = true);
        saveData();
    });
    document.getElementById('btn-uncheck-all').addEventListener('click', () => {
        allQA.forEach(qa => qa.checked = false);
        saveData();
    });

    // データクリア
    document.getElementById('btn-clear-data').addEventListener('click', () => {
        if (confirm("全てのデータを削除します。よろしいですか？")) {
            allQA = [];
            saveData();
        }
    });

    // --- 練習モード制御 ---
    const setupArea = document.getElementById('practice-setup');
    const activeArea = document.getElementById('practice-active');
    
    const elQuestion = document.getElementById('practice-question');
    const elAnswer = document.getElementById('practice-answer');
    const areaAnswer = document.getElementById('answer-area');
    const elProgress = document.getElementById('progress-text');
    
    const btnShowAnswer = document.getElementById('btn-show-answer');
    const btnNext = document.getElementById('btn-next');
    const btnFinish = document.getElementById('btn-finish');

    document.getElementById('btn-start').addEventListener('click', () => {
        targetQA = allQA.filter(qa => qa.checked !== false);
        
        if (targetQA.length === 0) {
            alert("少なくとも1つの質問を選択してください。");
            return;
        }

        const mode = document.querySelector('input[name="orderMode"]:checked').value;
        if (mode === 'random') {
            targetQA = [...targetQA].sort(() => Math.random() - 0.5);
        }

        currentIndex = 0;
        setupArea.classList.add('hidden');
        activeArea.classList.remove('hidden');
        activeArea.classList.add('flex');
        showQuestion();
    });

    function showQuestion() {
        const currentQA = targetQA[currentIndex];
        elQuestion.textContent = currentQA.q;
        elAnswer.textContent = currentQA.a;
        elProgress.textContent = `${currentIndex + 1} / ${targetQA.length}`;
        
        areaAnswer.classList.add('hidden');
        btnShowAnswer.classList.remove('hidden');
        btnNext.classList.add('hidden');
        btnFinish.classList.add('hidden');
    }

    btnShowAnswer.addEventListener('click', () => {
        areaAnswer.classList.remove('hidden');
        btnShowAnswer.classList.add('hidden');
        
        if (currentIndex < targetQA.length - 1) {
            btnNext.classList.remove('hidden');
        } else {
            btnFinish.classList.remove('hidden');
        }
    });

    btnNext.addEventListener('click', () => {
        currentIndex++;
        showQuestion();
    });

    function quitPractice() {
        activeArea.classList.add('hidden');
        activeArea.classList.remove('flex');
        setupArea.classList.remove('hidden');
    }

    document.getElementById('btn-quit').addEventListener('click', quitPractice);
    btnFinish.addEventListener('click', quitPractice);

    // --- タブ切り替え制御 ---
    const navItems = document.querySelectorAll('.nav-item');
    const pages = document.querySelectorAll('.page-content');

    function switchTab(targetId) {
        // 練習を強制終了
        quitPractice();

        // ページ切り替え
        pages.forEach(page => {
            if (page.id === targetId) {
                page.classList.remove('hidden');
                page.classList.add('block');
            } else {
                page.classList.add('hidden');
                page.classList.remove('block');
            }
        });

        // ナビゲーションのアクティブ状態切り替え
        navItems.forEach(item => {
            if (item.dataset.target === targetId) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab(item.dataset.target);
        });
    });

    // 起動時の初期化実行
    init();

</script>
</body>
</html>
