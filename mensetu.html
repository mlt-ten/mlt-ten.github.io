<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面接対策アプリ</title>
<!-- SheetJS (Excel読み込み用) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Tailwind CSS (スタイリング用) -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f3f4f6; color: #333; }
    .hidden { display: none !important; }
    /* スマホでのタップハイライトを無効化し、ボタンっぽく */
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .checkbox-custom { width: 1.25rem; height: 1.25rem; }
</style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

<div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-4">
    <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">面接対策アプリ</h1>

    <!-- 画面1: ファイル読み込み -->
    <div id="screen-upload" class="space-y-4">
        <p class="text-sm text-gray-600 mb-4">質問(A列)と回答(B列)が入力されたExcelファイル(.xlsx)を読み込んでください。</p>
        <div class="flex items-center justify-center w-full">
            <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">タップしてファイルを選択</span></p>
                </div>
                <input id="fileInput" type="file" accept=".xlsx, .xls" class="hidden" />
            </label>
        </div>
    </div>

    <!-- 画面2: 一覧と設定 -->
    <div id="screen-list" class="hidden space-y-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-lg font-bold">質問一覧・設定</h2>
            <button id="btn-reupload" class="text-sm text-blue-500 underline">別のファイル</button>
        </div>
        
        <div class="bg-blue-50 p-3 rounded-lg text-sm mb-4">
            <p class="font-bold mb-1">出題モード</p>
            <div class="flex space-x-4">
                <label class="flex items-center space-x-1 cursor-pointer">
                    <input type="radio" name="orderMode" value="sequential" checked class="w-4 h-4 text-blue-600">
                    <span>順番通り</span>
                </label>
                <label class="flex items-center space-x-1 cursor-pointer">
                    <input type="radio" name="orderMode" value="random" class="w-4 h-4 text-blue-600">
                    <span>ランダム</span>
                </label>
            </div>
        </div>

        <p class="text-sm text-gray-600 mb-2">練習する質問にチェックを入れてください（全て選択可）</p>
        <div class="flex justify-between text-xs mb-2">
            <button id="btn-check-all" class="text-blue-600 py-1 px-2 bg-blue-100 rounded">全て選択</button>
            <button id="btn-uncheck-all" class="text-gray-600 py-1 px-2 bg-gray-200 rounded">全て外す</button>
        </div>

        <div id="qa-list-container" class="max-h-64 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2">
            <!-- JavaScriptでリストを生成 -->
        </div>

        <button id="btn-start" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow mt-4 hover:bg-blue-700 active:bg-blue-800 transition">
            面接練習スタート
        </button>
    </div>

    <!-- 画面3: 練習画面 -->
    <div id="screen-practice" class="hidden space-y-6 flex flex-col h-full">
        <div class="flex justify-between items-center">
            <span id="progress-text" class="text-sm font-bold text-gray-500">1 / 5</span>
            <button id="btn-back-to-list" class="text-sm text-gray-500 underline">やめる</button>
        </div>

        <div class="bg-gray-50 border border-gray-200 rounded-xl p-5 shadow-inner flex-grow">
            <p class="text-xs text-gray-400 mb-1">質問</p>
            <p id="practice-question" class="text-lg font-bold text-gray-800 whitespace-pre-wrap leading-relaxed">ここに質問が表示されます</p>
        </div>

        <div id="answer-area" class="hidden flex-grow">
            <div class="bg-green-50 border border-green-200 rounded-xl p-5 shadow-inner">
                <p class="text-xs text-green-600 mb-1 font-bold">用意した回答</p>
                <p id="practice-answer" class="text-base text-gray-800 whitespace-pre-wrap leading-relaxed">ここに回答が表示されます</p>
            </div>
        </div>

        <div class="pt-4 space-y-3">
            <button id="btn-show-answer" class="w-full bg-gray-800 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-gray-700 active:bg-gray-900 transition">
                回答を見る
            </button>
            <button id="btn-next" class="hidden w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-blue-700 active:bg-blue-800 transition">
                次の質問へ
            </button>
            <button id="btn-finish" class="hidden w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-green-600 active:bg-green-700 transition">
                お疲れ様でした（一覧へ戻る）
            </button>
        </div>
    </div>
</div>

<script>
    // データ管理
    let allQA = []; // 読み込んだ全てのQA {id, q, a, checked}
    let targetQA = []; // 練習対象のQA
    let currentIndex = 0;

    // DOM要素
    const screenUpload = document.getElementById('screen-upload');
    const screenList = document.getElementById('screen-list');
    const screenPractice = document.getElementById('screen-practice');
    const fileInput = document.getElementById('fileInput');
    const qaListContainer = document.getElementById('qa-list-container');
    
    // Excel読み込み処理
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // 2次元配列として取得
            const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            
            allQA = [];
            let idCounter = 0;
            
            json.forEach((row, index) => {
                // A列(row[0])とB列(row[1])が存在するか確認
                if (row.length >= 2 && row[0] && row[1]) {
                    // ヘッダー行っぽいもの（「質問」「回答」）は除外する簡易処理
                    if (index === 0 && (row[0].includes('質問') || row[0] === 'Q')) return;
                    
                    allQA.push({
                        id: idCounter++,
                        q: String(row[0]).trim(),
                        a: String(row[1]).trim(),
                        checked: true // 初期状態は全てチェック
                    });
                }
            });

            if (allQA.length === 0) {
                alert("質問と回答が見つかりませんでした。A列に質問、B列に回答を入力してください。");
                return;
            }

            renderList();
            screenUpload.classList.add('hidden');
            screenList.classList.remove('hidden');
        };
        reader.readAsArrayBuffer(file);
    });

    // 一覧画面のレンダリング
    function renderList() {
        qaListContainer.innerHTML = '';
        allQA.forEach((qa, index) => {
            const div = document.createElement('div');
            div.className = "flex items-start space-x-3 p-2 hover:bg-gray-50 border-b border-gray-100 last:border-0";
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = "checkbox-custom mt-1 cursor-pointer accent-blue-600";
            checkbox.checked = qa.checked;
            checkbox.dataset.id = qa.id;
            checkbox.addEventListener('change', (e) => {
                qa.checked = e.target.checked;
            });

            const textDiv = document.createElement('div');
            textDiv.className = "flex-1";
            textDiv.innerHTML = `
                <p class="text-sm font-bold text-gray-800 line-clamp-2">${index + 1}. ${qa.q}</p>
                <p class="text-xs text-gray-500 mt-1 line-clamp-1">${qa.a}</p>
            `;
            
            div.appendChild(checkbox);
            div.appendChild(textDiv);
            
            // テキスト部分タップでもチェックをトグル
            textDiv.addEventListener('click', () => {
                checkbox.checked = !checkbox.checked;
                qa.checked = checkbox.checked;
            });

            qaListContainer.appendChild(div);
        });
    }

    // 全て選択 / 全て外す
    document.getElementById('btn-check-all').addEventListener('click', () => {
        allQA.forEach(qa => qa.checked = true);
        renderList();
    });
    document.getElementById('btn-uncheck-all').addEventListener('click', () => {
        allQA.forEach(qa => qa.checked = false);
        renderList();
    });

    // ファイル再アップロード
    document.getElementById('btn-reupload').addEventListener('click', () => {
        fileInput.value = '';
        screenList.classList.add('hidden');
        screenUpload.classList.remove('hidden');
    });

    // 練習スタート
    document.getElementById('btn-start').addEventListener('click', () => {
        targetQA = allQA.filter(qa => qa.checked);
        
        if (targetQA.length === 0) {
            alert("少なくとも1つの質問を選択してください。");
            return;
        }

        // ランダムモードならシャッフル
        const mode = document.querySelector('input[name="orderMode"]:checked').value;
        if (mode === 'random') {
            targetQA = targetQA.sort(() => Math.random() - 0.5);
        }

        currentIndex = 0;
        screenList.classList.add('hidden');
        screenPractice.classList.remove('hidden');
        showQuestion();
    });

    // 練習画面のUI要素
    const elQuestion = document.getElementById('practice-question');
    const elAnswer = document.getElementById('practice-answer');
    const areaAnswer = document.getElementById('answer-area');
    const elProgress = document.getElementById('progress-text');
    const btnShowAnswer = document.getElementById('btn-show-answer');
    const btnNext = document.getElementById('btn-next');
    const btnFinish = document.getElementById('btn-finish');

    function showQuestion() {
        const currentQA = targetQA[currentIndex];
        elQuestion.textContent = currentQA.q;
        elAnswer.textContent = currentQA.a;
        elProgress.textContent = `${currentIndex + 1} / ${targetQA.length}`;
        
        // UI初期化
        areaAnswer.classList.add('hidden');
        btnShowAnswer.classList.remove('hidden');
        btnNext.classList.add('hidden');
        btnFinish.classList.add('hidden');
    }

    // 回答を見る
    btnShowAnswer.addEventListener('click', () => {
        areaAnswer.classList.remove('hidden');
        btnShowAnswer.classList.add('hidden');
        
        if (currentIndex < targetQA.length - 1) {
            btnNext.classList.remove('hidden');
        } else {
            btnFinish.classList.remove('hidden');
        }
    });

    // 次の質問へ
    btnNext.addEventListener('click', () => {
        currentIndex++;
        showQuestion();
    });

    // やめる / 終わる (一覧へ戻る)
    document.getElementById('btn-back-to-list').addEventListener('click', () => {
        screenPractice.classList.add('hidden');
        screenList.classList.remove('hidden');
    });
    btnFinish.addEventListener('click', () => {
        screenPractice.classList.add('hidden');
        screenList.classList.remove('hidden');
    });

</script>
</body>
</html>
