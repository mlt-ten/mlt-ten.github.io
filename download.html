<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダウンロード</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; line-height: 1.8; }
        .download-card {
            border: 1px solid #ddd;
            padding: 40px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            display: block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #28a745; /* 安心感のある緑色 */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #218838; }
        .back-link { display: block; margin-top: 30px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="download-card">
        <h2>ファイルのダウンロード</h2>
        <p>写真と書類をまとめたZIPファイルです。</p>
        
        <a href="all-contents.zip" download class="btn">
            ZIPファイルをダウンロード
        </a>

        <a href="index.html" class="back-link">← トップページへ戻る</a>
    </div>

</body>
</html>
